<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="title desc">
  <title id="title">PINN 热方程时空采样示意</title>
  <desc id="desc">横轴为空间 x，纵轴为时间 t。底边橙色方块为初始点，左右边界紫色三角形为边界点，内部蓝色圆点为物理配点。点位仅为教学示意。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#334155"/></marker>
    <g id="initial"><rect x="-5" y="-5" width="10" height="10" fill="#c05611"/></g>
    <g id="boundary"><path d="M0 -7L7 5H-7Z" fill="#7753a8"/></g>
  </defs>
  <rect width="880" height="510" rx="16" fill="#f8fafc"/>
  <g font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" fill="#1e293b">
    <text x="38" y="43" font-size="24" font-weight="700">同一个时空区域，三类训练约束</text>
    <text x="38" y="74" font-size="15" fill="#475569">采样位置示意 · 点数与间距不代表训练设置</text>
    <rect x="100" y="120" width="460" height="290" fill="#eaf3fb" stroke="#94a3b8" stroke-width="2"/>
    <g stroke="#cbd5e1" stroke-dasharray="5 6"><path d="M215 120V410M330 120V410M445 120V410M100 192H560M100 265H560M100 337H560"/></g>
    <path d="M100 437V98M75 410H588" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <g font-size="17"><text x="67" y="416">0</text><text x="550" y="439">1</text><text x="74" y="126">1</text><text x="591" y="416">x</text><text x="96" y="96">t</text></g>
    <g fill="#2472a4" stroke="#fff" stroke-width="1.5">
      <circle cx="153" cy="156" r="5"/><circle cx="252" cy="173" r="5"/><circle cx="378" cy="151" r="5"/><circle cx="508" cy="167" r="5"/>
      <circle cx="184" cy="227" r="5"/><circle cx="301" cy="214" r="5"/><circle cx="410" cy="239" r="5"/><circle cx="525" cy="220" r="5"/>
      <circle cx="143" cy="293" r="5"/><circle cx="260" cy="272" r="5"/><circle cx="365" cy="303" r="5"/><circle cx="479" cy="283" r="5"/>
      <circle cx="198" cy="358" r="5"/><circle cx="293" cy="380" r="5"/><circle cx="395" cy="350" r="5"/><circle cx="521" cy="377" r="5"/>
    </g>
    <g><use href="#initial" x="100" y="410"/><use href="#initial" x="165" y="410"/><use href="#initial" x="230" y="410"/><use href="#initial" x="295" y="410"/><use href="#initial" x="360" y="410"/><use href="#initial" x="425" y="410"/><use href="#initial" x="490" y="410"/><use href="#initial" x="560" y="410"/></g>
    <g><use href="#boundary" x="100" y="145"/><use href="#boundary" x="100" y="207"/><use href="#boundary" x="100" y="269"/><use href="#boundary" x="100" y="331"/><use href="#boundary" x="100" y="386"/><use href="#boundary" x="560" y="145"/><use href="#boundary" x="560" y="207"/><use href="#boundary" x="560" y="269"/><use href="#boundary" x="560" y="331"/><use href="#boundary" x="560" y="386"/></g>
    <use href="#initial" x="630" y="153"/><text x="650" y="159" font-size="19" font-weight="700">初始点</text>
    <text x="620" y="187" font-size="16">t = 0，给定初始温度</text>
    <use href="#boundary" x="630" y="244"/><text x="650" y="250" font-size="19" font-weight="700">边界点</text>
    <text x="620" y="278" font-size="16">x = 0 或 1，温度为零</text>
    <circle cx="630" cy="337" r="6" fill="#2472a4"/><text x="650" y="343" font-size="19" font-weight="700">域内配点</text>
    <text x="620" y="371" font-size="16">用方程检查预测的导数</text>
    <text x="620" y="397" font-size="16">无需内部温度标签</text>
    <text x="100" y="481" font-size="16" fill="#475569">横轴为位置、纵轴为时间；矩形表示求解域，并非细杆的几何形状。</text>
  </g>
</svg>
